[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "crates/render", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
spotlight-core = { path = "crates/core" }
spotlight-platform = { path = "crates/platform" }
spotlight-render = { path = "crates/render" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
